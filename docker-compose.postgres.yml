# Override: troca o H2 pelo Postgres que roda no host (localhost:5432).
# Uso:  docker compose -f docker-compose.local.yml -f docker-compose.postgres.yml up -d --build
# Dados do H2: scripts/migrate-h2-to-postgres/migrate.sh
services:
  traccar-server:
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://host.docker.internal:5432/traccar
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
